# Security scan for the Bank code review (BSR-A1, BSR-A2, BSR-A3, BSR-A4).
#
# Reproduces, on every push and pull request, the toolchain that produced the
# 20260908-staging evidence pack by hand. The invocations here are deliberately
# identical to audit/run-audit.sh: if CI and the hand run disagree, the pack and
# the pipeline are describing different systems, which is worse than having
# neither.
#
# One file, copy-pasted into all six in-scope repositories, matching the existing
# gitleaks.yml convention. It detects what each repository actually contains
# rather than carrying six divergent variants.
#
# Every `uses:` is pinned to a commit SHA. Finding F-17 files 28 mutable action
# tags as High under BSR-C15; this workflow does not add a twenty-ninth.
name: Security scan

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Pinned by version, installed as a binary, matching the gitleaks.yml idiom.
  GITLEAKS_VERSION: "8.21.2"
  SEMGREP_VERSION: "1.97.0"
  TRIVY_VERSION: "0.58.1"
  # Two modules declare go 1.25.7, so the toolchain floor is that, not 1.24.
  GO_VERSION: "1.25.7"
  HELM_VERSION: "v3.16.3"
  SUPPRESSIONS: ".security-suppressions.yml"

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so secrets committed in the past are detected too.
          # This is the expensive checkout, which is why it is its own job.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan repository including git history
        run: |
          mkdir -p .scan
          gitleaks detect --source . --no-banner --redact \
            --report-format json --report-path .scan/gitleaks-report.json || true

      - name: Apply the threshold
        run: python3 .github/scripts/security-gate.py "$SUPPRESSIONS" .scan/gitleaks-report.json

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secrets-${{ github.sha }}
          path: .scan/
          retention-days: 90

  sast:
    name: static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install semgrep
        run: pipx install "semgrep==${SEMGREP_VERSION}" && semgrep --version

      # Configs and excludes copied verbatim from audit/run-audit.sh so the CI
      # numbers can be compared with the evidence pack line for line.
      - name: Scan
        run: |
          mkdir -p .scan
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/secrets \
            --metrics off --quiet \
            --exclude node_modules --exclude vendor --exclude dist --exclude build \
            --exclude weights --exclude samples --exclude '*.pt' --exclude '*.mp4' \
            --exclude '*.onnx' --exclude '*.safetensors' --exclude package-lock.json \
            --timeout 30 --timeout-threshold 3 \
            --json -o .scan/semgrep-report.json . || true

      - name: Apply the threshold
        run: python3 .github/scripts/security-gate.py "$SUPPRESSIONS" .scan/semgrep-report.json

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sast-${{ github.sha }}
          path: .scan/
          retention-days: 90

  deps:
    name: dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
        if: hashFiles('**/go.mod') != ''

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
        if: hashFiles('**/package.json') != ''

      # govulncheck at its default symbol scan level answers "does our code call
      # the vulnerable function", which is a different question from Trivy's
      # "is a vulnerable version in the graph". The gate counts only the first.
      - name: Scan Go modules
        run: |
          mkdir -p .scan
          command -v go >/dev/null || exit 0
          go install golang.org/x/vuln/cmd/govulncheck@latest
          find . -name go.mod -not -path '*/vendor/*' -not -path '*/node_modules/*' \
            | while read -r mod; do
              d=$(dirname "$mod")
              name=$(echo "${d#./}" | tr '/' '_')
              # F-35: synstream-k8s-resource imports its generated swagger docs,
              # which are gitignored, so the module does not build from a clean
              # checkout until they are regenerated.
              if [ -f "$d/Makefile" ] && grep -q '^swagger:' "$d/Makefile"; then
                go install github.com/swaggo/swag/cmd/swag@latest
                (cd "$d" && make swagger) || echo "swagger generation failed in $d"
              fi
              (cd "$d" && go mod download) || true
              (cd "$d" && govulncheck -format json ./...) \
                > ".scan/govulncheck-${name}.json" 2>>".scan/deps.log" || true
            done

      - name: Scan Node packages
        run: |
          mkdir -p .scan
          command -v npm >/dev/null || exit 0
          find . -name package.json -not -path '*/node_modules/*' -maxdepth 4 \
            | while read -r pkg; do
              d=$(dirname "$pkg")
              name=$(echo "${d#./}" | tr '/' '_')
              # npm audit needs a lockfile. Generating one here rather than
              # skipping keeps coverage stated rather than silently partial.
              [ -f "$d/package-lock.json" ] || \
                (cd "$d" && npm install --package-lock-only --ignore-scripts) >/dev/null 2>&1 || true
              [ -f "$d/package-lock.json" ] || { echo "no lockfile, skipped: $d" >> .scan/deps.log; continue; }
              (cd "$d" && npm audit --json) > ".scan/npmaudit-${name}.json" 2>>".scan/deps.log" || true
            done

      - name: State the coverage
        run: |
          {
            echo "### Dependency coverage"
            echo ""
            echo "| What | Count |"
            echo "|---|---|"
            echo "| Go modules scanned | $(ls .scan/govulncheck-*.json 2>/dev/null | wc -l) |"
            echo "| Go modules present | $(find . -name go.mod -not -path '*/vendor/*' -not -path '*/node_modules/*' | wc -l) |"
            echo "| Node packages scanned | $(ls .scan/npmaudit-*.json 2>/dev/null | wc -l) |"
            echo "| Node packages present | $(find . -name package.json -not -path '*/node_modules/*' -maxdepth 4 | wc -l) |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ -s .scan/deps.log ] && { echo ""; echo "Notes:"; echo '```'; cat .scan/deps.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Apply the threshold
        run: python3 .github/scripts/security-gate.py "$SUPPRESSIONS" .scan/govulncheck-*.json .scan/npmaudit-*.json

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deps-${{ github.sha }}
          path: .scan/
          retention-days: 90

  iac:
    name: infrastructure and images
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: ${{ env.HELM_VERSION }}
        if: hashFiles('**/Chart.yaml') != ''

      - name: Install trivy
        run: |
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy
          trivy --version

      # F-25: every one of the 60 chart template files contains {{, so none of
      # them parses as YAML and a generic scanner skips them in silence. Render
      # first, then scan the rendering, then state the count. BSR-A2 requires the
      # coverage measured, not assumed.
      - name: Render charts and kustomize overlays
        run: |
          mkdir -p .scan/rendered
          rendered=0; present=0; failed=""
          for chart in $(find . -name Chart.yaml -not -path '*/charts/*/charts/*' | sort); do
            d=$(dirname "$chart")
            n=$(find "$d/templates" -type f \( -name '*.yaml' -o -name '*.tpl' \) 2>/dev/null | wc -l)
            present=$((present + n))
            out=".scan/rendered/$(echo "${d#./}" | tr '/' '_').yaml"
            if helm template "$d" > "$out" 2>>.scan/render.log; then
              rendered=$((rendered + n))
            else
              failed="$failed $d"
            fi
          done
          for k in $(find . -name kustomization.yaml -not -path '*/node_modules/*' | sort); do
            d=$(dirname "$k")
            out=".scan/rendered/kustomize_$(echo "${d#./}" | tr '/' '_').yaml"
            kubectl kustomize "$d" > "$out" 2>>.scan/render.log || failed="$failed $d"
          done
          {
            echo "### Infrastructure-as-code coverage"
            echo ""
            echo "| What | Count |"
            echo "|---|---|"
            echo "| Chart template files present | $present |"
            echo "| Chart template files rendered and scanned | $rendered |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$failed" ]; then
            echo ""; echo "Failed to render:$failed" >> "$GITHUB_STEP_SUMMARY"
            echo "A chart that does not render is a chart nobody scanned. Failing."
            exit 1
          fi

      - name: Scan the working tree and the rendered manifests
        run: |
          trivy fs --scanners vuln,misconfig,secret \
            --skip-dirs node_modules --skip-dirs vendor \
            --format json -o .scan/trivy-report.json . || true
          if [ -d .scan/rendered ] && [ -n "$(ls -A .scan/rendered 2>/dev/null)" ]; then
            trivy config --format json -o .scan/trivy-rendered.json .scan/rendered || true
          fi

      - name: Generate the software bill of materials
        run: |
          trivy fs --format cyclonedx -o ".scan/sbom-${GITHUB_SHA}.cdx.json" \
            --skip-dirs node_modules --skip-dirs vendor . || true

      - name: Apply the threshold
        run: python3 .github/scripts/security-gate.py "$SUPPRESSIONS" .scan/trivy-report.json .scan/trivy-rendered.json

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iac-${{ github.sha }}
          path: .scan/
          retention-days: 90
